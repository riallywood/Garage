<title>Riallywood Collezione</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap">

<style>
/* ── Token system ── */
:root {
  --bg:        #0e0e10;
  --bg2:       #1a1a1e;
  --bg3:       #242428;
  --border:    #2e2e34;
  --fg:        #f0f0f2;
  --fg2:       #9898a6;
  --accent:    #e8c040;
  --accent2:   #c8a030;
  --mag:       #4ea8de;
  --no-mag:    #666680;

  --cat-gt:    #1e3a5f;
  --cat-gt-fg: #7ec8f4;
  --cat-f1:    #5f1e1e;
  --cat-f1-fg: #f47c7c;
  --cat-str:   #1e4a2a;
  --cat-str-fg:#7ed49a;
  --cat-wrc:   #3a1e5f;
  --cat-wrc-fg:#b87ef4;
  --cat-nas:   #5f3a1e;
  --cat-nas-fg:#f4aa7c;
  --cat-kar:   #2a2a2a;
  --cat-kar-fg:#cccccc;

  color-scheme: dark;
  --font-display: 'Barlow Condensed', sans-serif;
  --font-body:    'Barlow', sans-serif;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:      #f5f4f0;
    --bg2:     #ffffff;
    --bg3:     #eeecea;
    --border:  #d4d2cc;
    --fg:      #18181c;
    --fg2:     #5a5a6a;
    --cat-gt:  #dbeeff;
    --cat-gt-fg:#1a5080;
    --cat-f1:  #ffe0e0;
    --cat-f1-fg:#8b1010;
    --cat-str: #dff4e8;
    --cat-str-fg:#1a5c32;
    --cat-wrc: #ecdeff;
    --cat-wrc-fg:#5a1e8c;
    --cat-nas: #ffedda;
    --cat-nas-fg:#7c3a00;
    --cat-kar: #e8e8e8;
    --cat-kar-fg:#333333;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:      #f5f4f0;
  --bg2:     #ffffff;
  --bg3:     #eeecea;
  --border:  #d4d2cc;
  --fg:      #18181c;
  --fg2:     #5a5a6a;
  --cat-gt:  #dbeeff;
  --cat-gt-fg:#1a5080;
  --cat-f1:  #ffe0e0;
  --cat-f1-fg:#8b1010;
  --cat-str: #dff4e8;
  --cat-str-fg:#1a5c32;
  --cat-wrc: #ecdeff;
  --cat-wrc-fg:#5a1e8c;
  --cat-nas: #ffedda;
  --cat-nas-fg:#7c3a00;
  --cat-kar: #e8e8e8;
  --cat-kar-fg:#333333;
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0 }
html, body { height: 100%; font-family: var(--font-body); background: var(--bg); color: var(--fg) }

/* ── Layout shell ── */
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 560px;
  margin: 0 auto;
}

/* ── Header ── */
header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 0 max(16px, env(safe-area-inset-left, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 21;
}
.header-inner {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 52px;
}
.back-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .04em;
  cursor: pointer;
  padding: 6px 0;
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}
.back-btn:hover { color: var(--accent2) }
.back-btn svg { width: 16px; height: 16px; flex-shrink: 0 }
.header-title {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--fg);
}
.header-logo {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--accent);
}

/* ── Search bar ── */
.search-wrap {
  padding: 10px 0 6px;
}
.search-input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 14px;
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--fg);
  outline: none;
}
.search-input::placeholder { color: var(--fg2) }
.search-input:focus { border-color: var(--accent) }

/* ── Filter bar ── */
.filter-bar {
  padding: 0 0 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.filter-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.filter-row--col {
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
}
.filter-label {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--fg2);
  white-space: nowrap;
  flex-shrink: 0;
  min-width: 44px;
}
.filter-chips {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.chip {
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--fg2);
  cursor: pointer;
  transition: all .1s;
  user-select: none;
}
.chip:hover { border-color: var(--accent); color: var(--accent) }
.chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #000;
}
.chip.active-mag {
  background: var(--mag);
  border-color: var(--mag);
  color: #fff;
}

/* ── Scroll content ── */
#content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 8px;
}

/* ── Category grid ── */
.cat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding-top: 4px;
}
.cat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px 16px 14px;
  cursor: pointer;
  transition: transform .12s, box-shadow .12s;
  position: relative;
  overflow: hidden;
}
.cat-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--c-fg);
  opacity: .7;
}
.cat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,0,0,.3) }
.cat-card:active { transform: scale(.97) }
.cat-icon {
  font-size: 28px;
  margin-bottom: 10px;
  display: block;
}
.cat-name {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--c-fg);
}
.cat-count {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--fg2);
  margin-top: 3px;
}

/* ── Class list ── */
.cls-list { display: flex; flex-direction: column; gap: 8px }
.cls-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background .1s;
}
.cls-item:hover { background: var(--bg3) }
.cls-item:active { opacity: .8 }
.cls-name {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: .04em;
}
.cls-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}
.cls-count {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--fg2);
  background: var(--bg3);
  border-radius: 20px;
  padding: 2px 10px;
}
.cls-arrow { color: var(--fg2); font-size: 18px }

/* ── Car list ── */
.car-list { display: flex; flex-direction: column; gap: 6px }
.car-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: background .1s;
}
.car-item:hover { background: var(--bg3) }
.car-item:active { opacity: .8 }
.car-mag-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.car-info { flex: 1; min-width: 0 }
.car-name {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.car-brand {
  font-size: 12px;
  color: var(--fg2);
  margin-top: 2px;
}
.car-tr {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--fg2);
  flex-shrink: 0;
}
.car-arrow { color: var(--border); font-size: 16px; flex-shrink: 0 }

/* ── Car detail ── */
.car-detail {}
.car-detail-hero {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px 20px 20px;
  margin-bottom: 16px;
}
.car-detail-name {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: .04em;
  line-height: 1.1;
  text-wrap: balance;
  margin-bottom: 6px;
}
.car-detail-brand {
  font-size: 15px;
  color: var(--fg2);
  margin-bottom: 18px;
}
.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.badge {
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  border-radius: 20px;
  padding: 4px 12px;
  border: 1px solid currentColor;
}
.badge-mag  { color: var(--mag);    border-color: var(--mag);    background: color-mix(in srgb, var(--mag) 12%, transparent) }
.badge-nomag{ color: var(--no-mag); border-color: var(--no-mag); background: transparent }
.badge-tr   { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent) }
.badge-cls  { color: var(--c-fg,var(--fg2)); border-color: var(--c-fg,var(--fg2)); background: color-mix(in srgb, var(--c-fg,var(--fg2)) 10%, transparent) }

/* ── Car photo ── */
.car-photo-wrap {
  border-radius: 12px;
  overflow: hidden;
  background: var(--bg3);
  aspect-ratio: 16/9;
  margin-bottom: 16px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.car-photo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.detail-section {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 12px;
}
.detail-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 18px;
  border-bottom: 1px solid var(--border);
}
.detail-row:last-child { border-bottom: none }
.detail-label {
  font-size: 13px;
  color: var(--fg2);
  font-weight: 500;
}
.detail-value {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .03em;
  text-align: right;
}

/* ── Empty state ── */
.empty {
  text-align: center;
  padding: 48px 16px;
  color: var(--fg2);
}
.empty-icon { font-size: 40px; margin-bottom: 12px }
.empty-text { font-size: 15px }

/* ── Count bar ── */
.count-bar {
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--fg2);
  padding: 10px 0 8px;
}
</style>

ategory":"Stradali","gomma_diam":20,"gomma_larg":10},{"name":"Chevrolet Camaro GS","brand":"Hornby","sottoclasse":"Trans-Am - Anni '60-'70","tr":"19T","magnete":true,"category":"Stradali","anno":2014,"gomma_diam":20.5,"gomma_larg":10}];

// ── Taxonomy ──────────────────────────────────────────────────────────────────
const TAXONOMY = [
  { id:'gt',  name:'GT Le Mans', icon:'🏁', vars:'--cat-gt',  classes:[
    "GT Storiche - Anni '60-'80",
    "GT1 - Anni '90-2000",
    "GT Moderne '00 (gt2,gte,gt3, lmp)",
    "Group C - Anni '80-'90",
  ]},
  { id:'f1',  name:'Formula 1',  icon:'🔴', vars:'--cat-f1',  classes:[
    "F1 - Anni '50-'60",
    "F1 - Anni '70-'80",
    "F1 - Anni '80-'90",
    "F1 - Anni '90-'10",
    "F1 - Anni '2020",
  ]},
  { id:'str', name:'Stradali',   icon:'🚗', vars:'--cat-str', classes:[
    "Trans-Am - Anni '60-'70",
    "Caterham 7 - Anni '60-'80",
    "Beetle - Anni '70-'00",
    "Mini Challenge - Anni '90-'00",
    "Sportive e Supercars",
    "Mini - Anni '00-'10",
  ]},
  { id:'wrc', name:'WRC',        icon:'🌲', vars:'--cat-wrc', classes:["Rally WRC - Anni '90-'00"]},
  { id:'nas', name:'NASCAR',     icon:'🏟', vars:'--cat-nas', classes:["Nascar - Anni '90-'00"]},
  { id:'kar', name:'Kart',       icon:'🎯', vars:'--cat-kar', classes:['Go Kart']},
];

const CAT_BY_ID  = Object.fromEntries(TAXONOMY.map(c => [c.id, c]));
const CAT_BY_CLS = {};
TAXONOMY.forEach(cat => cat.classes.forEach(cls => CAT_BY_CLS[cls] = cat));

// ── State ─────────────────────────────────────────────────────────────────────
let state = {
  view: 'home',
  catId: null,
  cls: null,
  carIdx: null,
  search: '',
  filterMag: 'all',      // 'all' | 'yes' | 'no'
  filterTR: new Set(),   // empty = tutti
};

// ── Render ────────────────────────────────────────────────────────────────────
const content     = document.getElementById('content');
const headerInner = document.getElementById('header-inner');
const searchWrap  = document.getElementById('search-wrap');
const searchInput = document.getElementById('search-input');

const TR_ORDER = ['16T','17T','18T','19T','20T','21T','22T','23T','24T','25T','26-30','99 KO'];
function trRank(tr) {
  const i = TR_ORDER.indexOf(tr);
  return i >= 0 ? i : TR_ORDER.length;
}
function carSort(a, b) {
  const t = trRank(a.tr) - trRank(b.tr);
  if (t !== 0) return t;
  const br = a.brand.localeCompare(b.brand, 'it');
  if (br !== 0) return br;
  return a.name.localeCompare(b.name, 'it');
}
function carsByClass(cls) {
  return CARS.filter(c => c.sottoclasse === cls).sort(carSort);
}
function catCss(cat) {
  return `style="--c-bg:var(${cat.vars}-bg,transparent);--c-fg:var(${cat.vars}-fg)"`;
}

// Apply magnet + TR filters to a car array
function applyFilters(arr) {
  return arr.filter(c => {
    if (state.filterMag === 'yes' && !c.magnete) return false;
    if (state.filterMag === 'no'  &&  c.magnete) return false;
    if (state.filterTR.size > 0 && !state.filterTR.has(c.tr||'')) return false;
    return true;
  });
}

function render() {
  const { view, catId, cls, carIdx, search } = state;

  // Header
  if (view === 'home' || view === 'search') {
    headerInner.innerHTML = `<span class="header-logo">Riallywood</span>`;
    searchWrap.hidden = false;
    updateFilterChips();
  } else if (view === 'classes') {
    const cat = CAT_BY_ID[catId];
    headerInner.innerHTML = `
      <button class="back-btn" onclick="nav('home')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M10 3L5 8l5 5"/>
        </svg>
        Home
      </button>
      <span class="header-title">${cat.name}</span>`;
    searchWrap.hidden = true;
  } else if (view === 'cars') {
    const cat = CAT_BY_CLS[cls];
    headerInner.innerHTML = `
      <button class="back-btn" onclick="nav('classes','${cat.id}')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M10 3L5 8l5 5"/>
        </svg>
        ${cat.name}
      </button>
      <span class="header-title">${cls.split(' - ')[0]}</span>`;
    searchWrap.hidden = true;
  } else if (view === 'car') {
    const car = CARS[carIdx];
    headerInner.innerHTML = `
      <button class="back-btn" onclick="navToCarClass(${carIdx})">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M10 3L5 8l5 5"/>
        </svg>
        ${(car.sottoclasse||'').split(' - ')[0]}
      </button>`;
    searchWrap.hidden = true;
  }

  // Content
  if (view === 'home' || view === 'search') {
    if (search.trim().length > 1) {
      renderSearch(search);
    } else {
      renderHome();
    }
  } else if (view === 'classes') {
    renderClasses(catId);
  } else if (view === 'cars') {
    renderCars(cls);
  } else if (view === 'car') {
    renderCar(carIdx);
  }
}

function updateFilterChips() {
  // Magnete chips
  document.querySelectorAll('#mag-chips .chip').forEach(chip => {
    const val = chip.dataset.mag;
    chip.className = 'chip' + (val === state.filterMag ? ' active-mag' : '');
  });
  // TR chips
  document.querySelectorAll('#tr-chips .chip').forEach(chip => {
    const val = chip.dataset.tr;
    if (val === 'all') {
      chip.className = 'chip' + (state.filterTR.size === 0 ? ' active' : '');
    } else {
      chip.className = 'chip' + (state.filterTR.has(val) ? ' active' : '');
    }
  });
}

function renderHome() {
  let html = `<div class="cat-grid">`;
  TAXONOMY.forEach(cat => {
    const allInCat = CARS.filter(c => cat.classes.includes(c.sottoclasse));
    const filtered = applyFilters(allInCat);
    const total = allInCat.length;
    html += `
      <div class="cat-card" ${catCss(cat)} onclick="nav('classes','${cat.id}')">
        <span class="cat-icon">${cat.icon}</span>
        <div class="cat-name">${cat.name}</div>
        <div class="cat-count">${filtered.length}${filtered.length!==total?'/'+total:''} auto</div>
      </div>`;
  });
  html += `</div>`;
  content.innerHTML = html;
}

// Registro globale cls→indice per evitare problemi con apostrofi negli onclick inline
const CLS_INDEX = {};
TAXONOMY.forEach(cat => cat.classes.forEach((cls, i) => CLS_INDEX[cls] = cls));

function renderClasses(catId) {
  const cat = CAT_BY_ID[catId];
  // Salvo le classi in un array globale temporaneo accessibile dagli onclick
  window.__clsMap = window.__clsMap || {};
  let html = `<div class="cls-list">`;
  cat.classes.forEach((cls, i) => {
    const allCars = carsByClass(cls);
    if (!allCars.length) return;
    const filtered = applyFilters(allCars);
    const key = catId + '_' + i;
    window.__clsMap[key] = cls;
    const countStr = filtered.length !== allCars.length
      ? `${filtered.length}/${allCars.length}`
      : `${allCars.length}`;
    html += `
      <div class="cls-item" onclick="navCls('${key}')">
        <span class="cls-name">${cls}</span>
        <div class="cls-meta">
          <span class="cls-count">${countStr}</span>
          <span class="cls-arrow">›</span>
        </div>
      </div>`;
  });
  html += `</div>`;
  content.innerHTML = html;
}

function renderCars(cls) {
  const allCars = carsByClass(cls);
  const cars = applyFilters(allCars);
  const countLabel = cars.length < allCars.length ? `${cars.length} di ${allCars.length} auto` : `${cars.length} auto`;
  let html = `<div class="count-bar">${countLabel}</div><div class="car-list">`;
  cars.forEach(car => {
    const idx = CARS.indexOf(car);
    const dotColor = car.magnete ? '#e53535' : '#3b82f6';
    html += `
      <div class="car-item" onclick="nav('car','','',${idx})">
        <span class="car-mag-dot" style="background:${dotColor}" title="${car.magnete?'Con magnete':'Senza magnete'}"></span>
        <div class="car-info">
          <div class="car-name">${car.name}</div>
          <div class="car-brand">${car.brand}</div>
        </div>
        <span class="car-tr">${car.tr||'—'}</span>
        <span class="car-arrow">›</span>
      </div>`;
  });
  html += `</div>`;
  content.innerHTML = html;
}

function renderSearch(q) {
  const lq = q.toLowerCase();
  let results = CARS.filter(c =>
    c.name.toLowerCase().includes(lq) ||
    c.brand.toLowerCase().includes(lq) ||
    (c.sottoclasse||'').toLowerCase().includes(lq)
  );
  results = applyFilters(results).sort((a,b) => a.name.localeCompare(b.name));

  if (!results.length) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">Nessun risultato per "${q}"</div></div>`;
    return;
  }

  let html = `<div class="count-bar">${results.length} risultat${results.length===1?'o':'i'}</div><div class="car-list">`;
  results.forEach(car => {
    const idx = CARS.indexOf(car);
    const dotColor = car.magnete ? '#e53535' : '#3b82f6';
    html += `
      <div class="car-item" onclick="nav('car','','',${idx})">
        <span class="car-mag-dot" style="background:${dotColor}"></span>
        <div class="car-info">
          <div class="car-name">${car.name}</div>
          <div class="car-brand">${car.brand} · ${car.sottoclasse||'—'}</div>
        </div>
        <span class="car-tr">${car.tr||'—'}</span>
        <span class="car-arrow">›</span>
      </div>`;
  });
  html += `</div>`;
  content.innerHTML = html;
}

// ── Navigation ────────────────────────────────────────────────────────────────
function navCls(key) {
  const cls = window.__clsMap[key];
  if (!cls) return;
  nav('cars', '', cls);
}
function navToCarClass(idx) {
  const car = CARS[idx];
  nav('cars', '', car.sottoclasse);
}

function nav(view, catId, cls, carIdx) {
  state.view = view;
  if (catId !== undefined && catId !== 'undefined' && catId !== 'null' && catId !== '') state.catId = catId;
  if (cls !== undefined && cls !== 'undefined' && cls !== 'null') state.cls = cls ? decodeURIComponent(cls) : null;
  if (carIdx !== undefined && carIdx !== 'undefined' && carIdx !== 'null') state.carIdx = (carIdx !== null && carIdx !== '') ? Number(carIdx) : null;
  if (view === 'home') { state.search = ''; if (searchInput) searchInput.value = ''; }
  content.scrollTop = 0;
  render();
}

// ── Filter interactions ───────────────────────────────────────────────────────
document.getElementById('mag-chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  state.filterMag = chip.dataset.mag;
  render();
});

document.getElementById('tr-chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const val = chip.dataset.tr;
  if (val === 'all') {
    state.filterTR.clear();
  } else {
    if (state.filterTR.has(val)) {
      state.filterTR.delete(val);
    } else {
      state.filterTR.add(val);
    }
  }
  render();
});

// Search
searchInput.addEventListener('input', e => {
  state.search = e.target.value;
  state.view = state.search.trim().length > 1 ? 'search' : 'home';
  render();
});

// ── Boot ──────────────────────────────────────────────────────────────────────
render();
</script>
