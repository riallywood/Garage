<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Collezione Slot Car</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1d1d1f;--mut:#6b6b70;--acc:#c8102e;--line:#e3ded6;--ok:#2d7a3e}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--card:#222226;--ink:#f2f2f4;--mut:#9a9aa2;--line:#33333a;--acc:#ff4d63;--ok:#5fcf7a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
header{padding:14px 16px 6px}h1{margin:0;font-size:22px}header small{color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mut);font-size:13px;font-weight:600}
nav button.on{color:var(--acc)}
.wrap{padding:8px 12px;max-width:900px;margin:auto}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}
label{font-size:12px;color:var(--mut);display:block;margin:0 0 3px 2px}
.car{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.car b{display:block}.car span{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--line);margin:2px 3px 0 0;color:var(--ink)}
.tag.m{background:var(--ok);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none}
.sheet.on{display:block}
.sheet>div{position:absolute;bottom:0;left:0;right:0;max-height:88%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:700px;margin:auto}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:15px;margin:10px 0}.kv i{color:var(--mut);font-style:normal}
a.btn,button.btn{display:block;text-align:center;padding:12px;border-radius:10px;background:var(--acc);color:#fff;text-decoration:none;font-weight:600;border:0;width:100%;margin-top:10px;font-size:16px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:14px;margin:8px 0}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mut)}
tfoot td{font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}.kpi{background:var(--card);border-radius:12px;padding:10px;text-align:center;border:1px solid var(--line)}.kpi b{font-size:22px;display:block}.kpi span{font-size:11px;color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:flex;margin-top:4px}.bar i{display:block;background:var(--ok)}
h2{font-size:17px;margin:16px 4px 4px}.hint{color:var(--mut);font-size:13px;margin:2px 4px 8px}
.sug{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.sug b{display:block}.sug button{margin-top:6px;border:1px solid var(--acc);color:var(--acc);background:none;border-radius:8px;padding:6px 12px;font-size:14px}
.sc{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;color:#fff;background:var(--ok)}
.sc.mid{background:#c98a00}.sc.low{background:#b33}
.hide{display:none}
.scw{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.scw label{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 13px;font-size:15px}.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}.chips small{opacity:.7}
</style></head><body>
<header><h1>🏁 Collezione Slot Car</h1><small id="sub"></small></header>
<div class="wrap">
<section id="t-auto">
<input id="q" type="search" placeholder="Cerca auto, pilota, produttore, colore…">
<div class="row"><div><label>Categoria</label><select id="fcl"></select></div><div><label>Produttore</label><select id="fmk"></select></div></div>
<div class="row hide" id="fscw"><div class="scw"><label id="fsct"></label><div class="chips" id="fsc"></div></div></div>
<div class="row"><div><label>Magnete</label><select id="fmg"><option value="">Tutti</option><option value="1">Con</option><option value="0">Senza</option></select></div><div><label>Teca</label><select id="fte"><option value="">Tutte</option><option value="1">Con teca</option><option value="0">Senza teca</option></select></div></div>
<div class="row"><div style="grid-column:1/-1"><label>TR (tempo) – scegline uno</label><div class="chips" id="ftr"></div></div><div style="grid-column:1/-1"><label>&nbsp;</label><label style="display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink);padding:10px 4px"><input id="fadj" type="checkbox" style="width:22px;height:22px"> includi adiacenti (±1)</label></div></div>
<div class="hint" id="cnt"></div><div id="list"></div>
</section>
<section id="t-stat" class="hide"></section>
<section id="t-gare" class="hide">
<h2>Costruisci una gara</h2><div class="hint">Filtra e vedi quanto sono omogenee le auto selezionate.</div>
<div class="row"><div><label>Categoria</label><select id="gcl"></select></div></div>
<div class="row hide" id="gscw"><div class="scw"><label id="gsct"></label><div class="chips" id="gsc"></div></div></div>
<div class="row3"><div><label>Magnete</label><select id="gmg"><option value="">Tutti</option><option value="1">Con</option><option value="0">Senza</option></select></div><div><label>Giri/min min</label><input id="gr1" type="number" inputmode="numeric" placeholder="es. 18000"></div><div><label>Giri/min max</label><input id="gr2" type="number" inputmode="numeric" placeholder="es. 22000"></div></div>
<div class="row"><div style="grid-column:1/-1"><label>TR (tempo) – scegline uno</label><div class="chips" id="gtr"></div></div><div><label>&nbsp;</label><label style="display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink);padding:10px 4px"><input id="gadj" type="checkbox" style="width:22px;height:22px"> includi adiacenti (±1)</label></div></div>
<div class="row"><div><label>Produttore</label><select id="gmk"></select></div><div><label>Motore</label><select id="gmo"></select></div></div>
<div id="gres"></div>
<h2>Gruppi suggeriti</h2><div class="hint">Gruppi con almeno 4 auto, ordinati per omogeneità (stessa classe, magnete, motore, giri, TR).</div>
<div id="gsug"></div>
</section>
</div>
<div class="sheet" id="sh"><div id="shc"></div></div>
<nav><button data-t="auto" class="on">🚗 Auto</button><button data-t="stat">📊 Statistiche</button><button data-t="gare">🏆 Gare</button></nav>

 el.innerHTML=items.map(([v,l])=>`<button type="button" data-v="${esc(v)}" class="${v===""?"on":""}">${esc(l)}${v?` <small>${cars.filter(c=>c.tr===v).length}</small>`:""}</button>`).join("");
 el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;el.dataset.v=b.dataset.v;el.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));el.dispatchEvent(new Event("input"))})});
$("#sub").textContent=cars.length+" auto · "+cars.filter(c=>c.mg).length+" con magnete · "+cars.filter(c=>c.teca).length+" in teca · copia dati del "+D.date;
function trOk(c,t,adj){if(!t)return 1;const n=t==='99 KO'?99:parseInt(t);if(c.trn==null)return 0;if(c.trn===n)return 1;return adj&&n<99&&c.trn<99&&Math.abs(c.trn-n)===1?1:0}
function match(c,f){
 if(!trOk(c,f.tr,f.adj))return 0;
 if(f.q){const h=(c.n+" "+c.mk+" "+c.pil+" "+c.col+" "+c.sub+" "+c.gm+" "+c.num).toLowerCase();if(!f.q.toLowerCase().split(/\s+/).every(w=>h.includes(w)))return 0}
 if(f.cl&&c.cat!==f.cl)return 0;if(f.cls&&f.cls.length&&!f.cls.includes(c.cl))return 0;if(f.mk&&c.mk!==f.mk)return 0;
 if(f.mg!==""&&f.mg!==undefined&&String(c.mg)!==f.mg)return 0;
 if(f.te!==undefined&&f.te!==""&&String(c.teca)!==f.te)return 0;if(f.mo&&!c.mo.includes(f.mo))return 0;
 if(f.r1&&!(c.rpm&&c.rpm>=f.r1))return 0;if(f.r2&&!(c.rpm&&c.rpm<=f.r2))return 0;return 1}

// secondo livello: classi della categoria scelta (selezione multipla, nessuna = tutte)
function buildSc(p){
 const cat=$("#"+p+"cl").value,w=$("#"+p+"scw"),el=$("#"+p+"sc");
 el.dataset.v="";
 const ks=cat?ORD.filter(k=>cars.some(c=>c.cat===cat&&c.cl===k)):[];
 if(ks.length<2){w.classList.add("hide");el.innerHTML="";return}
 w.classList.remove("hide");
 $("#"+p+"sct").textContent="Classi di "+cat+" – scegline una o più (nessuna = tutte)";
 el.innerHTML=`<button type="button" data-v="" class="on">Tutte <small>${cars.filter(c=>c.cat===cat).length}</small></button>`+ks.map(k=>`<button type="button" data-v="${k}">${esc(CL[k])} <small>${cars.filter(c=>c.cl===k).length}</small></button>`).join("");
}
["f","g"].forEach(p=>{const el=$("#"+p+"sc");
 el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  let sel=el.dataset.v?el.dataset.v.split(","):[];
  if(b.dataset.v==="")sel=[];else sel=sel.includes(b.dataset.v)?sel.filter(x=>x!==b.dataset.v):sel.concat(b.dataset.v);
  el.dataset.v=sel.join(",");
  el.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.v===""?!sel.length:sel.includes(x.dataset.v)));
  el.dispatchEvent(new Event("input"))});
 $("#"+p+"cl").addEventListener("input",()=>buildSc(p))});
const getCls=p=>{const v=$("#"+p+"sc").dataset.v;return v?v.split(","):[]};
function row(c){return `<div class="car" data-id="${c.id}"><div><b>${esc(c.n)}${c.num!=null?" #"+c.num:""}</b><span>${esc(c.mk)} · ${esc(CL[c.cl])}</span>${c.col?`<span style="color:var(--ink)">🎨 ${esc(c.col.trim().replace(/^./,m=>m.toUpperCase()))}</span>`:''}<div>${c.mg?'<span class="tag m">magnete</span>':''}${c.teca?'<span class="tag">teca</span>':''}${c.tr?`<span class="tag">TR ${esc(c.tr)}</span>`:''}${c.rpm?`<span class="tag">${c.rpm} rpm</span>`:''}${c.gm?`<span class="tag">⌀ ${esc(c.gm)}</span>`:''}</div></div><span>›</span></div>`}
const trKey=c=>c.trn==null?999:c.trn;
function byTR(a,b){return trKey(a)-trKey(b)||a.n.localeCompare(b.n)}
function renderList(){
 const f={q:$("#q").value.trim(),cl:$("#fcl").value,mk:$("#fmk").value,mg:$("#fmg").value,tr:$("#ftr").dataset.v||"",adj:$("#fadj").checked,cls:getCls("f"),te:$("#fte").value};
 let r=cars.filter(c=>match(c,f)); r.sort(byTR);
 $("#cnt").textContent=r.length+" auto";$("#list").innerHTML=r.map(row).join("")}
["#q","#fcl","#fsc","#fmk","#fmg","#fte","#ftr","#fadj"].forEach(s=>$(s).addEventListener("input",renderList));
function open_(id){const c=cars.find(x=>x.id===id);
 const kv=[["Classe",CL[c.cl]],["Produttore",c.mk],["TR",c.tr],["Magnete",c.mg?"Sì":"No"],["Teca",c.teca?"Sì":"No"],["Epoca",c.pe.map(e=>"'"+e).join(", ")],["Anno",c.yr],["Sottoclasse",c.sub],["Colore",c.col],["Piloti",c.pil],["Numero",c.num],["Gomme (mm)",c.gm],["Gomme collegate",c.ty.join("; ")],["Motore",c.mo.join("; ")],["Giri/min",c.rpm],["Rapporto",c.rap],["Luci",c.luci?"Sì":""]].filter(x=>x[1]!==""&&x[1]!=null);
 $("#shc").innerHTML=`<h2 style="margin-top:0">${esc(c.n)}</h2><div class="kv">${kv.map(x=>`<i>${x[0]}</i><span>${esc(x[1])}</span>`).join("")}</div><a class="btn" target="_blank" href="https://airtable.com/appbHGdDaomNZ7D8Z/tbl32CYHxtHhIczl4/rec${c.id}">Apri in Airtable (foto)</a><button class="btn" style="background:var(--line);color:var(--ink)" id="cl">Chiudi</button>`;
 $("#sh").classList.add("on");$("#cl").onclick=()=>$("#sh").classList.remove("on")}
document.addEventListener("click",e=>{const el=e.target.closest(".car");if(el)open_(el.dataset.id);if(e.target.id==="sh")$("#sh").classList.remove("on")});
// stats
function stats(){
 const tot=cars.length,mg=cars.filter(c=>c.mg).length;
 const rp=cars.filter(c=>c.rpm).map(c=>c.rpm);
 let h=`<div class="kpis"><div class="kpi"><b>${tot}</b><span>auto</span></div><div class="kpi"><b>${mg}</b><span>con magnete</span></div><div class="kpi"><b>${tot-mg}</b><span>senza</span></div><div class="kpi"><b>${Math.round(100*mg/tot)}%</b><span>magnete</span></div></div>`;
 h+=`<h2>Per classe</h2><table><tr><th>Classe</th><th>Auto</th><th>Con</th><th>Senza</th></tr>`+ORD.filter(k=>cars.some(c=>c.cl===k)).map(k=>{const a=cars.filter(c=>c.cl===k),m=a.filter(c=>c.mg).length;return `<tr><td>${CL[k]}<div class="bar"><i style="width:${100*m/a.length}%"></i></div></td><td>${a.length}</td><td>${m}</td><td>${a.length-m}</td></tr>`}).join("")+`<tfoot><tr><td>Totale</td><td>${tot}</td><td>${mg}</td><td>${tot-mg}</td></tr></tfoot></table>`;
 const grp=(title,key)=>{const m={};cars.forEach(c=>{const ks=Array.isArray(key(c))?key(c):[key(c)];ks.forEach(k=>{if(k===""||k==null)return;m[k]=(m[k]||0)+1})});return `<h2>${title}</h2><table>`+Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("")+`</table>`};
 h+=grp("Per TR",c=>c.tr?"TR "+c.tr:"")+grp("Per produttore",c=>c.mk)+grp("Per epoca",c=>c.pe.map(e=>"Anni '"+e))+grp("Per motore",c=>c.mo);
 const lt={};cars.forEach(c=>{const k=c.dia?c.dia.toFixed(1):"n/d";lt[k]=(lt[k]||0)+1});
 h+=`<h2>Per diametro gomma (mm)</h2><table>`+Object.entries(lt).sort((a,b)=>parseFloat(a[0])-parseFloat(b[0])).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")+`</table>`;
 h+=`<h2>Giri/min motore</h2><div class="hint">${rp.length} auto con dato · min ${Math.min(...rp)} · max ${Math.max(...rp)} · media ${Math.round(rp.reduce((a,b)=>a+b,0)/rp.length)}</div>`;
 $("#t-stat").innerHTML=h}
// gare
function homog(a){ // 0-100
 let s=100;const n=a.length;
 const cls=new Set(a.map(c=>c.cl)).size;s-=(cls-1)*8;
 const mg=a.filter(c=>c.mg).length;const mm=Math.min(mg,n-mg)/n;s-=mm*30;
 const rp=a.filter(c=>c.rpm).map(c=>c.rpm);if(rp.length>2){const sp=(Math.max(...rp)-Math.min(...rp));s-=Math.min(25,sp/400)}
 const d=a.filter(c=>c.dia).map(c=>c.dia);if(d.length>2){s-=Math.min(15,(Math.max(...d)-Math.min(...d))*4)}
 const tn=a.filter(c=>c.trn&&c.trn<99).map(c=>c.trn);if(tn.length>1)s-=Math.min(15,(Math.max(...tn)-Math.min(...tn))*3);
 const ep=new Set(a.map(c=>c.era)).size;s-=(ep-1)*4;
 return Math.max(0,Math.round(s))}
const scCls=s=>s>=75?"":s>=55?"mid":"low";
function gareRes(){
 const f={cl:$("#gcl").value,cls:getCls("g"),mg:$("#gmg").value,mk:$("#gmk").value,mo:$("#gmo").value,tr:$("#gtr").dataset.v||"",adj:$("#gadj").checked,r1:+$("#gr1").value||0,r2:+$("#gr2").value||0};
 const r=cars.filter(c=>match(c,f));
 if(!r.length){$("#gres").innerHTML=`<div class="sug">Nessuna auto con questi filtri.</div>`;return}
 const rp=r.filter(c=>c.rpm).map(c=>c.rpm),h=homog(r);
 $("#gres").innerHTML=`<div class="sug"><b>${r.length} auto · omogeneità <span class="sc ${scCls(h)}">${h}/100</span></b><span class="hint">${rp.length?`giri ${Math.min(...rp)}–${Math.max(...rp)} · `:""}${r.filter(c=>c.mg).length} con magnete · ${new Set(r.map(c=>c.mk)).size} produttori</span></div>`+r.sort((a,b)=>trKey(a)-trKey(b)||(a.rpm||0)-(b.rpm||0)).map(row).join("")}
["#gcl","#gsc","#gmg","#gmk","#gmo","#gr1","#gr2","#gtr","#gadj"].forEach(s=>$(s).addEventListener("input",gareRes));
function suggest(){
 const out=[],seen=new Set();
 const add=(label,a,set)=>{if(a.length<4)return;const k=a.map(c=>c.id).sort().join();if(seen.has(k))return;seen.add(k);out.push({label,a,h:homog(a),set})};
 ORD.forEach(k=>{const a=cars.filter(c=>c.cl===k);if(!a.length)return;
  const m=a.filter(c=>c.mg),s=a.filter(c=>!c.mg);
  add(CL[k]+" · con magnete",m,{cl:k,mg:"1"});add(CL[k]+" · senza magnete",s,{cl:k,mg:"0"});add(CL[k]+" · tutte",a,{cl:k});
  const mos=uniq(a.flatMap(c=>c.mo));mos.forEach(mo=>add(CL[k]+" · motore "+mo,a.filter(c=>c.mo.includes(mo)),{cl:k,mo}))});
 // classi affini per epoca
 const groups={"GT classiche + Group C":["GS","GC"],"GT moderne + GT1":["GM","GT1"],"Formula 1 anni '70-'00":["F7","F8","F9"],"Turismo/Mini":["MI","MC","BE"]};
 Object.entries(groups).forEach(([l,ks])=>{[1,0].forEach(m=>add(l+(m?" · con magnete":" · senza magnete"),cars.filter(c=>ks.includes(c.cl)&&c.mg===m),{cls:ks,mg:String(m)}))});
 trLabels.filter(x=>x!=='99 KO').forEach(x=>{[[0,''],[1,' + adiacenti']].forEach(([adj,s])=>[1,0].forEach(m=>add(`TR ${x}${s} · ${m?'con':'senza'} magnete`,cars.filter(c=>trOk(c,x,adj)&&c.mg===m),{tr:x,adj})))});

 out.sort((a,b)=>b.h-a.h||b.a.length-a.a.length);
 $("#gsug").innerHTML=out.slice(0,24).map((g,i)=>`<div class="sug"><b>${esc(g.label)}</b><span class="hint">${g.a.length} auto · omogeneità <span class="sc ${scCls(g.h)}">${g.h}</span></span><br><button data-i="${i}">Vedi auto</button></div>`).join("");
 $("#gsug").onclick=e=>{const b=e.target.closest("button");if(!b)return;const g=out[+b.dataset.i];
  $("#shc").innerHTML=`<h2 style="margin-top:0">${esc(g.label)}</h2><div class="hint">${g.a.length} auto</div>`+g.a.sort((x,y)=>trKey(x)-trKey(y)||(x.rpm||0)-(y.rpm||0)).map(row).join("")+`<button class="btn" id="cl">Chiudi</button>`;$("#sh").classList.add("on");$("#cl").onclick=()=>$("#sh").classList.remove("on")}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));["auto","stat","gare"].forEach(t=>$("#t-"+t).classList.toggle("hide",t!==b.dataset.t));scrollTo(0,0)});
renderList();stats();suggest();gareRes();
</script></body></html>
